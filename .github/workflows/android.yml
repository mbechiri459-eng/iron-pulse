name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iron-pulse-android
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: iron-pulse-android.zip
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q ../iron-pulse-android.zip -d ..
        working-directory: .
      - run: npm install
      - run: npm run prepare:web
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: iron-pulse-android/android
      - uses: actions/upload-artifact@v4
        with:
          name: iron-pulse-debug-apk
          path: iron-pulse-android/android/app/build/outputs/apk/debug/app-debug.apk
